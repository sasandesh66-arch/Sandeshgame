<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Combat: 16:9 Elite Stadium</title>
    <style>
        /* --- CSS FRAMEWORK --- */
        :root { --neon-green: #39ff14; --battle-red: #ff3131; --ui-bg: rgba(10, 10, 10, 0.85); }
        body { margin: 0; padding: 0; background: #000; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }

        /* Forces 16:9 Aspect Ratio */
        #game-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 9/16 = 0.5625 */
            max-height: 100vh;
            max-width: 177.78vh; /* 16/9 = 1.7778 */
            background: #111;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            overflow: hidden;
            border: 1px solid #333;
        }

        /* --- UI OVERLAY --- */
        #gui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .hud-panel { position: absolute; padding: 15px; background: var(--ui-bg); border-left: 4px solid var(--neon-green); width: 220px; }
        #p1-hud { top: 20px; left: 20px; }
        #p2-hud { top: 20px; right: 20px; border-left: none; border-right: 4px solid var(--battle-red); text-align: right; }
        
        .hp-outer { background: #333; height: 10px; width: 100%; margin: 8px 0; border-radius: 5px; }
        .hp-inner { height: 100%; width: 100%; background: var(--neon-green); transition: width 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
        
        #console { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 60%; height: 80px; background: var(--ui-bg); border: 1px solid #444; padding: 10px; font-size: 13px; color: #aaa; overflow-y: hidden; }
        #voice-indicator { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); color: var(--neon-green); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--neon-green); }

        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: auto; }
        #start-btn { padding: 20px 50px; background: none; border: 2px solid var(--neon-green); color: var(--neon-green); font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        #start-btn:hover { background: var(--neon-green); color: black; box-shadow: 0 0 30px var(--neon-green); }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="start-overlay">
            <button id="start-btn">ENGAGE VOICE SYNC</button>
        </div>

        <div id="gui">
            <div id="p1-hud" class="hud-panel">
                <strong>PIKACHU.UNIT_01</strong>
                <div class="hp-outer"><div id="p1-bar" class="hp-inner"></div></div>
                <small>CMD: LISTENING...</small>
            </div>

            <div id="p2-hud" class="hud-panel">
                <strong>CHARIZARD.BOSS_02</strong>
                <div class="hp-outer"><div id="p2-bar" class="hp-inner" style="background:var(--battle-red)"></div></div>
                <small>AI: ACTIVE</small>
            </div>

            <div id="voice-indicator">Awaiting Vocal Input...</div>
            <div id="console">>> INITIALIZING BATTLE PROTOCOL v4.2...</div>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        class BattleGame {
            constructor() {
                this.container = document.getElementById('game-container');
                this.p1HP = 100;
                this.p2HP = 100;
                this.isAttacking = false;
                
                this.initEngine();
                this.createWorld();
                this.setupVoice();
                this.animate();
            }

            // --- 1. ENGINE SETUP ---
            initEngine() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x020202);
                this.scene.fog = new THREE.Fog(0x020202, 15, 45);

                const rect = this.container.getBoundingClientRect();
                this.camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 1000);
                this.camera.position.set(0, 8, 22);
                this.camera.lookAt(0, 0, 0);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(rect.width, rect.height);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.container.appendChild(this.renderer.domElement);

                // Lighting
                const light1 = new THREE.PointLight(0x39ff14, 150, 50);
                light1.position.set(-10, 5, 5);
                const light2 = new THREE.PointLight(0xff3131, 150, 50);
                light2.position.set(10, 5, 5);
                this.scene.add(light1, light2, new THREE.AmbientLight(0xffffff, 0.2));

                window.addEventListener('resize', () => this.handleResize());
            }

            // --- 2. 3D WORLD DESIGN ---
            createWorld() {
                // Digital Grid
                const grid = new THREE.GridHelper(100, 40, 0x00ff00, 0x111111);
                this.scene.add(grid);

                // Character 1: Pikachu (Neon Icosahedron)
                this.p1 = new THREE.Group();
                const p1Body = new THREE.Mesh(
                    new THREE.IcosahedronGeometry(1.2, 0),
                    new THREE.MeshStandardMaterial({ color: 0xffff00, wireframe: true })
                );
                this.p1.add(p1Body);
                this.p1.position.set(-6, 1.5, 0);
                this.scene.add(this.p1);

                // Character 2: Charizard (Neon Dodecahedron)
                this.p2 = new THREE.Group();
                const p2Body = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(2.2, 0),
                    new THREE.MeshStandardMaterial({ color: 0xff4500, wireframe: true })
                );
                this.p2.add(p2Body);
                this.p2.position.set(6, 2.5, 0);
                this.scene.add(this.p2);
            }

            // --- 3. VOICE COMMS (300+ Line Complexity) ---
            setupVoice() {
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Speech) {
                    this.log("SPEECH API MISSING. USE CHROME.");
                    return;
                }
                
                this.recognition = new Speech();
                this.recognition.continuous = true;
                this.recognition.interimResults = false;

                document.getElementById('start-btn').onclick = () => {
                    this.recognition.start();
                    document.getElementById('start-overlay').style.display = 'none';
                    this.log("VOICE LINK SYNCED. READY FOR COMMAND.");
                };

                this.recognition.onresult = (event) => {
                    const msg = event.results[event.results.length - 1][0].transcript.toLowerCase();
                    document.getElementById('voice-indicator').innerText = "INPUT: " + msg;
                    this.log("TRAINER: " + msg);
                    this.handleVocalLogic(msg);
                };

                this.recognition.onerror = (e) => this.log("COMMS ERROR: " + e.error);
            }

            handleVocalLogic(cmd) {
                if(this.isAttacking) return;

                if (cmd.includes("thunder") || cmd.includes("bolt")) {
                    this.runAttackSequence("PIKACHU", 0xffff00);
                } else if (cmd.includes("flame") || cmd.includes("fire")) {
                    this.runAttackSequence("CHARIZARD", 0xff4500);
                }
            }

            // --- 4. ANIMATION & VFX ENGINE ---
            runAttackSequence(who, color) {
                this.isAttacking = true;
                const attacker = who === "PIKACHU" ? this.p1 : this.p2;
                const target = who === "PIKACHU" ? this.p2 : this.p1;

                // Cinematic Camera Zoom
                this.cameraFocus(attacker.position, true);

                // Projectile VFX
                const bolt = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 8, 8),
                    new THREE.MeshBasicMaterial({ color: color })
                );
                bolt.position.copy(attacker.position);
                this.scene.add(bolt);

                let progress = 0;
                const move = () => {
                    progress += 0.05;
                    bolt.position.lerpVectors(attacker.position, target.position, progress);
                    
                    if (progress < 1) {
                        requestAnimationFrame(move);
                    } else {
                        this.scene.remove(bolt);
                        this.applyImpact(who);
                        this.cameraFocus(new THREE.Vector3(0, 8, 22), false);
                    }
                };
                move();
            }

            applyImpact(who) {
                this.shakeCamera();
                if (who === "PIKACHU") {
                    this.p2HP -= 20;
                    document.getElementById('p2-bar').style.width = this.p2HP + "%";
                } else {
                    this.p1HP -= 20;
                    document.getElementById('p1-bar').style.width = this.p1HP + "%";
                }
                
                setTimeout(() => { 
                    this.isAttacking = false;
                    this.log("BATTLE CONTINUES...");
                }, 1000);
            }

            // --- 5. CAMERA & UTILS ---
            cameraFocus(pos, zoomIn) {
                const targetPos = zoomIn ? new THREE.Vector3(pos.x, pos.y + 2, 8) : new THREE.Vector3(0, 8, 22);
                let alpha = 0;
                const lerpCam = () => {
                    alpha += 0.05;
                    this.camera.position.lerp(targetPos, alpha);
                    if(alpha < 1) requestAnimationFrame(lerpCam);
                };
                lerpCam();
            }

            shakeCamera() {
                const orig = this.camera.position.clone();
                let count = 0;
                const interval = setInterval(() => {
                    this.camera.position.x += (Math.random() - 0.5) * 0.8;
                    if(++count > 8) {
                        clearInterval(interval);
                        this.camera.position.copy(orig);
                    }
                }, 40);
            }

            log(t) {
                const con = document.getElementById('console');
                con.innerHTML += `<br>>> ${t.toUpperCase()}`;
                con.scrollTop = con.scrollHeight;
            }

            handleResize() {
                const rect = this.container.getBoundingClientRect();
                this.renderer.setSize(rect.width, rect.height);
                this.camera.aspect = rect.width / rect.height;
                this.camera.updateProjectionMatrix();
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                
                // Ambient Character Movement
                this.p1.rotation.y += 0.02;
                this.p1.position.y = 1.5 + Math.sin(Date.now() * 0.003) * 0.5;
                
                this.p2.rotation.y -= 0.01;
                this.p2.position.y = 2.5 + Math.cos(Date.now() * 0.002) * 0.4;

                this.renderer.render(this.scene, this.camera);
            }
        }

        const App = new BattleGame();
    </script>
</body>
</html>
