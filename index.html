<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandesh - Astro Boss Fight V2</title>
<style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; cursor: none; }
    #ui {
        position: absolute; top: 20px; left: 20px; color: #00f2ff; pointer-events: none; text-shadow: 0 0 10px #00f2ff;
    }
    .bar-container {
        width: 250px; height: 12px; background: rgba(0, 242, 255, 0.1); 
        margin: 8px 0; border: 1px solid #00f2ff; border-radius: 2px; overflow: hidden;
    }
    .bar { height: 100%; width: 100%; transition: width 0.3s ease; }
    #player-health { background: #00f2ff; box-shadow: 0 0 10px #00f2ff; }
    #fire-energy { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; }
    #shield-energy { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
    #boss-health { background: #ff0044; box-shadow: 0 0 10px #ff0044; }
    
    #status-text { margin: 10px 0; font-size: 0.8em; letter-spacing: 2px; color: #fff; }
    video { position: absolute; bottom: 20px; right: 20px; width: 160px; transform: scaleX(-1); border: 2px solid #00f2ff; border-radius: 10px; opacity: 0.7; }
    
    #game-over {
        position: absolute; top:50%; left:50%; transform: translate(-50%, -50%);
        color: #fff; font-size: 60px; text-align: center; display:none;
        text-shadow: 0 0 20px #ff0044;
    }
    .restart-hint { font-size: 20px; color: #00f2ff; margin-top: 20px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="ui">
    <div style="font-weight: 900; font-size: 1.2em;">PILOT: SANDESH</div>
    <div id="status-text">INITIATING NEURAL LINK...</div>
    <div class="bar-container"><div id="player-health" class="bar"></div></div>
    <div style="font-size: 0.7em;">WEAPON SYSTEMS</div>
    <div class="bar-container"><div id="fire-energy" class="bar"></div></div>
    <div style="font-size: 0.7em;">SHIELD CAPACITOR</div>
    <div class="bar-container"><div id="shield-energy" class="bar"></div></div>
    <br>
    <div style="font-weight: 900; color: #ff0044;">BOSS: MUBBARIM-IS-NOOB</div>
    <div class="bar-container" style="border-color: #ff0044;"><div id="boss-health" class="bar"></div></div>
</div>

<div id="game-over">
    <div id="result-text">MISSION FAILED</div>
    <div class="restart-hint">REFRESH TO RE-ENGAGE</div>
</div>

<video id="webcam" playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
// ================= GAME VARIABLES =================
let scene, camera, renderer, starGeo, stars;
let playerShip, player, boss, shieldMesh, lasers=[], bossLasers=[];
let playerHealth = 100, fireEnergy = 100, shieldEnergy = 100, bossHealth = 200;
let isGameOver = false, shieldActive = false, handX=0, handY=0;

// ================= THREE.JS INIT =================
function initThree() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 5;
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- STARFIELD ---
    starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<1500; i++){
        starCoords.push(Math.random()*600-300, Math.random()*600-300, Math.random()*600-300);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords,3));
    const starMat = new THREE.PointsMaterial({color:0xffffff, size:0.7});
    stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // --- PLAYER SHIP ---
    const pGroup = new THREE.Group();
    const bodyGeo = new THREE.ConeGeometry(0.25,0.5,8);
    const pMat = new THREE.MeshBasicMaterial({color:0x00f2ff});
    player = new THREE.Mesh(bodyGeo, pMat);
    player.rotation.x = Math.PI;
    pGroup.add(player);

    // Shield visual
    const sGeo = new THREE.SphereGeometry(0.4,16,16);
    const sMat = new THREE.MeshBasicMaterial({color:0x00ff88, transparent:true, opacity:0.3, wireframe:true});
    shieldMesh = new THREE.Mesh(sGeo, sMat);
    shieldMesh.visible = false;
    pGroup.add(shieldMesh);

    scene.add(pGroup);
    playerShip = pGroup;

    // --- BOSS ---
    const bGeo = new THREE.BoxGeometry(1.5,0.6,0.5);
    const bMat = new THREE.MeshBasicMaterial({color:0xff0044});
    boss = new THREE.Mesh(bGeo, bMat);
    boss.position.y = 3;
    scene.add(boss);

    animate();
}

// ================= LASER FUNCTIONS =================
function shootLaser() {
    if(fireEnergy>=5 && !isGameOver){
        fireEnergy -= 2;
        const l = new THREE.Mesh(new THREE.BoxGeometry(0.05,0.4,0.05), new THREE.MeshBasicMaterial({color:0x00f2ff}));
        l.position.set(playerShip.position.x, playerShip.position.y+0.4,0);
        scene.add(l); lasers.push(l);
    }
}

function shootBossLaser() {
    if(isGameOver) return;
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.5,0.1), new THREE.MeshBasicMaterial({color:0xff0044}));
    l.position.set(boss.position.x+(Math.random()-0.5), boss.position.y-0.4,0);
    scene.add(l); bossLasers.push(l);
}

// ================= ANIMATION LOOP =================
function animate(){
    requestAnimationFrame(animate);
    if(isGameOver) return;

    // Stars
    stars.rotation.y += 0.001;
    stars.position.z += 0.5;
    if(stars.position.z>200) stars.position.z=0;

    // Player follow hand
    playerShip.position.x += (handX - playerShip.position.x)*0.15;
    playerShip.position.y += (handY - playerShip.position.y)*0.15;
    playerShip.rotation.z = -(handX - playerShip.position.x)*0.5;

    // Player lasers
    lasers.forEach((l,i)=>{
        l.position.y += 0.4;
        if(l.position.y>6){ scene.remove(l); lasers.splice(i,1); }
        if(l.position.distanceTo(boss.position)<0.8){
            bossHealth -= 2;
            boss.position.x += (Math.random()-0.5)*0.2;
            scene.remove(l); lasers.splice(i,1);
        }
    });

    // Boss lasers
    bossLasers.forEach((l,i)=>{
        l.position.y -= 0.15;
        if(l.position.y<-6){ scene.remove(l); bossLasers.splice(i,1); }
        if(l.position.distanceTo(playerShip.position)<0.4){
            if(shieldActive && shieldEnergy>0){ shieldEnergy-=0.5; }
            else { playerHealth-=5; }
            scene.remove(l); bossLasers.splice(i,1);
        }
    });

    // Boss movement
    boss.position.x = Math.sin(Date.now()*0.002)*2.5;

    // Energy recovery
    if(!shieldActive && shieldEnergy<100) shieldEnergy+=0.2;
    if(fireEnergy<100) fireEnergy+=0.4;
    shieldMesh.visible = shieldActive && shieldEnergy>5;

    if(playerHealth<=0) endGame(false);
    if(bossHealth<=0) endGame(true);

    updateUI();
    renderer.render(scene,camera);
}

// ================= UI =================
function updateUI(){
    document.getElementById('player-health').style.width = playerHealth+'%';
    document.getElementById('fire-energy').style.width = fireEnergy+'%';
    document.getElementById('shield-energy').style.width = shieldEnergy+'%';
    document.getElementById('boss-health').style.width = (bossHealth/2)+'%';
}

// ================= GAME OVER =================
function endGame(win){
    isGameOver = true;
    document.getElementById('game-over').style.display='block';
    document.getElementById('result-text').innerText = win?'VICTORY: BOSS ELIMINATED':'SYSTEM CRITICAL: DEFEATED';
    document.getElementById('result-text').style.textShadow = win?'0 0 20px #00f2ff':'0 0 20px #ff0044';
}

// ================= HAND GESTURE =================
const hands = new Hands({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
hands.setOptions({maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.6});
hands.onResults(res=>{
    if(res.multiHandLandmarks && res.multiHandLandmarks[0]){
        document.getElementById('status-text').innerText='NEURAL LINK: STABLE';
        const lm=res.multiHandLandmarks[0];
        handX=(0.5-lm[9].x)*8;
        handY=(0.5-lm[9].y)*6;

        const fingersUp=[lm[8].y<lm[6].y, lm[12].y<lm[10].y, lm[16].y<lm[14].y, lm[20].y<lm[18].y];
        const pinchDist=Math.hypot(lm[4].x-lm[8].x, lm[4].y-lm[8].y);

        // Fire = two fingers up, NOT pinch
        if(fingersUp[0] && fingersUp[1] && !fingersUp[2]){
            shootLaser();
        }

        // Shield = fist
        shieldActive = !fingersUp[0] && !fingersUp[1] && !fingersUp[2] && !fingersUp[3];
    } else {
        document.getElementById('status-text').innerText='NEURAL LINK: SEARCHING...';
        shieldActive=false;
    }
});

// ================= CAMERA =================
const videoElement=document.getElementById('webcam');
const cameraHelper=new Camera(videoElement,{
    onFrame: async()=>{ await hands.send({image:videoElement}); },
    width:480, height:360
});
cameraHelper.start();

// Boss auto-fire
setInterval(shootBossLaser,1200);

initThree();
window.addEventListener('resize',()=>{
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
